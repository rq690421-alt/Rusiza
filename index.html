<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RUİZA AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111318;
      color: #f4f6fb;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 14px 16px;
      background: #1a1e26;
      border-bottom: 1px solid #2b313d;
      font-weight: bold;
      font-size: 18px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
    }
    .bot {
      align-self: flex-start;
      background: #222733;
      color: #f4f6fb;
    }
    .bar {
      padding: 10px 12px;
      background: #1a1e26;
      border-top: 1px solid #2b313d;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #363e4f;
      background: #111318;
      color: #fff;
      font-size: 15px;
    }
    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: #16a34a;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>RUİZA AI</header>
  <div id="chat">
    <div class="msg bot">Salam! RUİZA AI hazırdır. Sualınızı yazın.</div>
  </div>
  <div class="bar">
    <input id="prompt" type="text" placeholder="Mesaj yazın..." />
    <button id="send">Göndər</button>
  </div>

  <script>
    const API_KEY = "BURAYA_GEMINI_API_ACARINIZI_YAPISDIRIN";
    const MODEL = "gemini-2.5-flash";

    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      if (!API_KEY || API_KEY === "BURAYA_GEMINI_API_ACARINIZI_YAPISDIRIN") {
        addMsg("Zəhmət olmasa koddakı API_KEY hissəsinə öz Gemini API açarınızı yazın.", "bot");
        return;
      }

      addMsg(text, "user");
      inputEl.value = "";
      const loadingMsg = addMsg("Düşünür...", "bot");

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(API_KEY)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text }] }]
            })
          }
        );

        const data = await res.json();
        if (!res.ok) {
          loadingMsg.textContent = "Xəta: " + (data.error?.message || res.status);
          return;
        }

        const reply =
          data.candidates?.[0]?.content?.parts?.[0]?.text || "Cavab alınmadı.";
        loadingMsg.textContent = reply;
      } catch (err) {
        loadingMsg.textContent = "Şəbəkə xətası: " + err.message;
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
